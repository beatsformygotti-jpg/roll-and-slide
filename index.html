.device-frame{padding:2.4% 2.3% 3.1%;position:relative;border:1px solid #101d2b;border-radius:11.9%/5.25%;background:linear-gradient(135deg,#647e91,#263848 23%,#142536 79%,#687f95);box-shadow:0 0 0 1px #587489,inset 0 0 0 2px #607485,0 13px 42px #071526bc,0 3px 7px #102130;}
.device-frame:after{content:"";position:absolute;right:-1.2%;top:18.5%;width:1%;height:9.9%;border-radius:2px;background:linear-gradient(#293b4e,#698499);box-shadow:-1px 0 #172334;}
.metro-screen{position:relative;display:block;aspect-ratio:720/1640;container-type:inline-size;background:#e9e8d2;border:1px solid #14253a;border-radius:10.3%/4.55%;overflow:hidden;isolation:isolate;}
.metro-screen:focus-visible{outline:2px solid #ffdc83;outline-offset:3px;}
.notch{position:absolute;top:-.1cqw;left:50%;transform:translateX(-50%);width:10.1cqw;height:4.7cqw;background:#192b3a;border-radius:0 0 51% 51% / 0 0 95% 95%;z-index:10;pointer-events:none;}
.notch:after{content:"";position:absolute;left:50%;top:.6cqw;transform:translateX(-50%);width:2.6cqw;height:2.6cqw;border-radius:50%;background:radial-gradient(circle at 44% 43%,#4e7090,#131e30 57%);}
.game-view{position:absolute;inset:0;}
.game-view[hidden],.home-view[hidden],.metro-modal[hidden]{display:none;}
.full-board{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
.full-board:active{cursor:grabbing;}
.metro-hud{pointer-events:none;position:absolute;z-index:2;top:2.35cqw;left:5.1cqw;right:5.1cqw;display:flex;justify-content:space-between;color:#153b66;}
.metro-hud .value{font-size:6.5cqw;font-weight:850;line-height:.92;letter-spacing:-.07em;font-variant-numeric:tabular-nums;}
.metro-hud .label{font-size:2.65cqw;font-weight:770;line-height:1;display:block;margin-bottom:.7cqw;}
.stat-right{text-align:right;}
.station-btn{appearance:none;cursor:pointer;color:#f8f0d8;background:#2a547e;border:.38cqw solid #9cbbd1;font:760 5.05cqw/1.07 "Avenir Next",system-ui,sans-serif;min-height:13cqw;padding:2.7cqw 3.6cqw;position:relative;text-align:center;box-shadow:0 .8cqw #0c2345;border-radius:1.2cqw;}
.station-btn.primary{background:#f1bf69;color:#183654;border-color:#fff0bd;box-shadow:0 .85cqw #845430;}
.station-btn:hover:not(:disabled){filter:brightness(1.1);}
.station-btn:focus-visible{outline:.65cqw solid #fff5b5;outline-offset:.8cqw;}
.station-btn:disabled{opacity:.52;cursor:default;}
.metro-modal{position:absolute;z-index:7;inset:0;background:#0e294a9a;display:grid;place-items:center;padding:8%;}
.dialog{width:100%;padding:5.8cqw 5.1cqw 5.3cqw;background:#1a3c65;color:#f5eed6;border:.54cqw solid #f1e6c5;outline:.36cqw solid #6e9db6;outline-offset:-1.55cqw;box-shadow:0 2.4cqw 4cqw #112c4d65;text-align:left;border-radius:1.1cqw;}
.dialog h2{font-size:9.2cqw;line-height:.95;letter-spacing:-.075em;margin:0 0 2.4cqw;font-weight:850;}
.dialog p{font-size:3.88cqw;line-height:1.37;font-weight:650;margin:0 0 4.3cqw;color:#e4e4db;}
.dialog .station-btn{display:block;width:100%;margin-top:2.6cqw;font-size:4.4cqw;min-height:12cqw;}
.level-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:2.1cqw;margin-top:3.7cqw;margin-bottom:3.5cqw;}
.level-buttons .station-btn{padding:0;margin:0;min-height:11.2cqw;}
.level-buttons .station-btn[aria-current=true]{border-color:#fee2a2;color:#ffe2a0;}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;}
@media(max-width:550px) and (orientation:portrait){.metro-app{width:min(calc((100svh - 16px)*.435),calc(100vw - 10px));margin:5px auto;}}
.level-buttons{grid-template-columns:repeat(5,1fr);gap:1.6cqw;}
.level-buttons .station-btn.done::after{content:"";position:absolute;bottom:.85cqw;left:calc(50% - .45cqw);width:.9cqw;height:.9cqw;background:#ecc871;border-radius:50%;}
.metro-app{width:auto;display:flex;align-items:flex-start;justify-content:center;gap:clamp(13px,2.6vw,33px);padding:0 12px;}
.metro-app .device-frame{width:min(calc((100svh - 42px)*.445),calc(100vw - 164px),480px);flex:none;padding:clamp(4px,.76vw,9px) clamp(4px,.72vw,9px) clamp(6px,.93vw,12px);}
.orientation-picker{display:grid;align-content:start;gap:7px;margin-top:20px;white-space:nowrap;color:#e1ebeb;font-size:12px;font-weight:740;}
.orientation-options{display:grid;grid-template-columns:1fr;gap:4px;background:#142b42bf;border:1px solid #9fbad073;padding:4px;border-radius:9px;}
.orientation-options button{font:750 12px/1.1 "Avenir Next",system-ui,sans-serif;padding:8px 9px;min-height:36px;text-align:left;color:#e7f0f1;background:none;border:0;border-radius:5px;cursor:pointer;}
.orientation-options button[aria-pressed=true]{background:#f0d18b;color:#183754;}
.orientation-options button:focus-visible{outline:2px solid #e6eba8;outline-offset:2px;}
.metro-app.landscape{align-items:center;}
.metro-app.landscape .device-frame{width:min(calc(100vw - 177px),calc((100svh - 58px)*2.2),1190px);border-radius:5.25%/11.9%;}
.landscape .device-frame::after{right:15%;top:-1%;width:12%;height:1%;}
.landscape .metro-screen{aspect-ratio:1640/720;border-radius:4.55%/10.3%;}
.landscape .notch{left:0;top:50%;width:1.95cqw;height:4.2cqw;transform:translate(-.15cqw,-50%);border-radius:0 90% 90% 0 / 0 56% 56% 0;}
.landscape .notch::after{width:1.1cqw;height:1.1cqw;top:50%;left:.85cqw;transform:translate(-50%,-50%);}
.landscape .metro-hud{top:3cqw;left:1.7cqw;right:1.7cqw;}
.landscape .metro-hud .label{font-size:1.05cqw;margin-bottom:.35cqw;}
.landscape .metro-hud .value{font-size:3.1cqw;}
.landscape .station-btn{font-size:2.1cqw;min-height:5cqw;padding:.95cqw 1.45cqw;box-shadow:0 .37cqw #0c2345;border-width:.17cqw;border-radius:.45cqw;}
.landscape .station-btn.primary{box-shadow:0 .4cqw #845430;}
.landscape .metro-modal{padding:3.5cqw;}
.landscape .dialog{width:39cqw;padding:2.55cqw;outline-width:.17cqw;outline-offset:-.57cqw;border-width:.24cqw;border-radius:.44cqw;}
.landscape .dialog h2{font-size:4.35cqw;margin-bottom:1cqw;}
.landscape .dialog p{font-size:1.65cqw;margin-bottom:1.35cqw;}
.landscape .dialog .station-btn{font-size:1.86cqw;min-height:4.95cqw;margin-top:1cqw;}
.landscape .level-buttons{gap:.7cqw;margin:1.5cqw 0 0;}
.landscape .level-buttons .station-btn{margin:0;min-height:4.3cqw;}
.landscape .level-buttons .station-btn.done::after{bottom:.29cqw;left:calc(50% - .2cqw);width:.4cqw;height:.4cqw;}
@media(max-width:610px){
 .metro-app,.metro-app.landscape{flex-direction:column;align-items:center;gap:8px;margin:5px auto;padding:0 6px;}
 .orientation-picker{order:-1;display:flex;align-items:center;gap:7px;margin:0;font-size:10px;}
 .orientation-options{grid-template-columns:1fr 1fr;gap:3px;padding:2px;}
 .orientation-options button{padding:4px 6px;min-height:27px;font-size:10.5px;text-align:center;}
 .metro-app .device-frame{width:min(calc((100svh - 52px)*.432),calc(100vw - 12px));}
 .metro-app.landscape .device-frame{width:min(calc(100vw - 12px),calc((100svh - 55px)*2.2));}
}
.landscape .home-view[hidden]{display:none;}
.landscape .stat-right .label{max-width:6.55cqw;line-height:1.12;}
.swipe-tutorial{position:absolute;left:50%;bottom:13cqw;transform:translateX(-50%);z-index:2;display:grid;grid-template-columns:13.8cqw 1fr;align-items:center;gap:2.7cqw;width:75cqw;padding:2.8cqw 3.4cqw;border:.4cqw solid #a4b6ad;border-top:.75cqw solid #366d92;border-radius:1.2cqw;background:#faf3db;color:#173954;box-shadow:0 1cqw 2.5cqw #2954752b;pointer-events:none;}
.swipe-tutorial[hidden]{display:none;}
.swipe-tutorial strong{display:block;font-weight:850;font-size:5.6cqw;line-height:1.03;letter-spacing:-.045em;}
.swipe-tutorial small{display:block;margin-top:1.15cqw;font-size:3.25cqw;font-weight:650;line-height:1.2;color:#416176;}
.swipe-gesture{position:relative;width:13.8cqw;height:13.8cqw;border:1px solid #adc0bd;border-radius:50%;background:#e5e8d7;display:grid;place-items:center;}
.swipe-track{position:relative;display:block;width:8.8cqw;height:1.65cqw;background:#255b83;clip-path:polygon(0 31%,72% 31%,72% 0,100% 50%,72% 100%,72% 69%,0 69%);transform:rotate(var(--swipe-angle));}
.swipe-tutorial[data-direction=up]{--swipe-angle:-90deg;--gesture-x:0;--gesture-y:-1;}
.swipe-tutorial[data-direction=right]{--swipe-angle:0deg;--gesture-x:1;--gesture-y:0;}
.swipe-tutorial[data-direction=down]{--swipe-angle:90deg;--gesture-x:0;--gesture-y:1;}
.swipe-tutorial[data-direction=left]{--swipe-angle:180deg;--gesture-x:-1;--gesture-y:0;}
.swipe-gesture i{position:absolute;width:3.9cqw;height:3.9cqw;border-radius:50%;background:#f6bd5e;border:.34cqw solid #fff2ca;box-shadow:0 0 0 .26cqw #775a43,0 0 1.4cqw #e4a13d8c;animation:swipe-pointer 1.6s ease-in-out infinite;}
.swipe-tutorial[data-direction=restart] .swipe-track{background:none;clip-path:none;width:auto;height:auto;}
.swipe-tutorial[data-direction=restart] .swipe-track::before{content:'↶';font:850 7.8cqw/1 system-ui,sans-serif;}
.swipe-tutorial[data-direction=restart] .swipe-gesture i{display:none;}
@keyframes swipe-pointer{
 0%,15%{transform:translate(calc(var(--gesture-x)*var(--swipe-distance,-3.2cqw)),calc(var(--gesture-y)*var(--swipe-distance,-3.2cqw)));opacity:0;}
 32%{transform:translate(calc(var(--gesture-x)*var(--swipe-distance,-3.2cqw)),calc(var(--gesture-y)*var(--swipe-distance,-3.2cqw)));opacity:1;}
 70%,85%{transform:translate(calc(var(--gesture-x)*var(--swipe-distance,-3.2cqw)*-1),calc(var(--gesture-y)*var(--swipe-distance,-3.2cqw)*-1));opacity:1;}
 100%{transform:translate(calc(var(--gesture-x)*var(--swipe-distance,-3.2cqw)*-1),calc(var(--gesture-y)*var(--swipe-distance,-3.2cqw)*-1));opacity:0;}
}
.level-buttons .is-rated>span{display:inline-block;transform:translateY(-.65cqw);}
.level-buttons .is-rated.done::after{display:none;}
.landscape .swipe-tutorial{left:auto;right:3cqw;bottom:auto;top:49%;transform:translateY(-50%);width:23.7cqw;grid-template-columns:4.8cqw 1fr;gap:1cqw;padding:1.2cqw;border-width:.17cqw;border-top-width:.35cqw;border-radius:.5cqw;--swipe-distance:-1.15cqw;}
.landscape .swipe-gesture{width:4.8cqw;height:4.8cqw;}
.landscape .swipe-track{width:3.35cqw;height:.66cqw;}
.landscape .swipe-gesture i{width:1.48cqw;height:1.48cqw;border-width:.13cqw;box-shadow:0 0 0 .1cqw #775a43,0 0 .4cqw #e4a13d8c;}
.landscape .swipe-tutorial strong{font-size:2.42cqw;}
.landscape .swipe-tutorial small{font-size:1.22cqw;margin-top:.38cqw;}
.landscape .swipe-tutorial[data-direction=restart] .swipe-track::before{font-size:2.72cqw;}
.landscape .level-buttons .is-rated>span{transform:translateY(-.29cqw);}
.home-view{position:absolute;inset:0;overflow:hidden;background:#13365d;color:#fff3d5;}
.home-field{position:absolute;inset:0;width:100%;height:100%;display:block;}
.home-layout{position:absolute;inset:var(--menu-inset-y,0) var(--menu-inset-x,0);display:grid;grid-template-columns:repeat(var(--menu-columns,9),minmax(0,1fr));grid-template-rows:repeat(var(--menu-rows,20),minmax(0,1fr));pointer-events:none;}
.home-layout .station-btn{pointer-events:auto;align-self:center;width:100%;height:calc(var(--menu-cell)*.88);min-height:min(44px,calc(var(--menu-cell)*1.16));padding:0 .25em;background:linear-gradient(#5a7f9e,#284f76 80%);border-color:#abc5d3;border-radius:1.2cqw;box-shadow:0 .6cqw #163458,inset 0 .35cqw #ffffff2b;font-size:4.55cqw;line-height:1.04;}
.home-layout .station-btn.primary{background:linear-gradient(#ffe2a3,#ecb75e);border-color:#ffedc1;color:#193858;box-shadow:0 .6cqw #91653d,inset 0 .3cqw #fff3da8e;}
.home-layout .station-btn:disabled{opacity:1;background:#294769;color:#b3c8d4;border-color:#7b9ab4;box-shadow:0 .6cqw #143454,inset 0 .22cqw #aac9d020;}
.landscape .home-layout .station-btn{font-size:2.1cqw;border-radius:.46cqw;box-shadow:0 .28cqw #163458,inset 0 .17cqw #ffffff31;}
.landscape .home-layout .station-btn.primary{box-shadow:0 .28cqw #91653d,inset 0 .15cqw #fff3da8e;}

.metro-modal[data-screen=win]{background:#0d284870;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.result-dialog{position:relative;padding:7.2cqw 5.75cqw 5.8cqw;background:radial-gradient(ellipse at 52% 4%,#fffdf3,#f7f3e7 81%);color:#193959;border:0;outline:0;border-radius:6.25cqw;box-shadow:0 4cqw 13cqw #132d4b62;text-align:center;}
.result-dialog h2{font-size:7.15cqw;line-height:1.12;letter-spacing:-.05em;margin:0 0 4.2cqw;text-wrap:balance;}
.rating-balls{display:flex;justify-content:center;align-items:center;gap:2.4cqw;margin:0 auto 4cqw;}
.rating-slot{position:relative;width:15.6cqw;height:15.6cqw;}
.rating-slot canvas{position:absolute;inset:0;display:block;width:100%;height:100%;}
.rating-slot .rating-ball{opacity:0;}
.rating-slot.earned .rating-ball{animation:score-arrival .57s cubic-bezier(.18,.76,.24,1) both;animation-delay:calc(.24s + var(--slot-order,0)*.2s);}
.rating-slot:nth-child(2){--slot-order:1;}
.rating-slot:nth-child(3){--slot-order:2;}
.rating-slot.earned::after{content:'';position:absolute;inset:14%;border-radius:50%;border:.45cqw solid #fff1bd;opacity:0;animation:score-ring .45s ease-out both;animation-delay:calc(.54s + var(--slot-order,0)*.2s);pointer-events:none;}
@keyframes score-arrival{0%{transform:translateY(-48%) rotate(-28deg) scale(.73);opacity:0;}46%{opacity:1;}73%{transform:translateY(5%) rotate(6deg) scale(1.07,.93);opacity:1;}100%{transform:none;opacity:1;}}
@keyframes score-ring{0%{opacity:.85;transform:scale(.83);}100%{opacity:0;transform:scale(1.34);}}
.rating-meter{padding:0;text-align:left;}
.rating-meter-label{display:flex;justify-content:space-between;align-items:baseline;gap:1cqw;color:#4c6578;font-size:3.64cqw;font-weight:720;margin-bottom:1.35cqw;}
.rating-percent{color:#1d507b;font-variant-numeric:tabular-nums;font-weight:860;font-size:5.15cqw;line-height:1;}
.rating-track{position:relative;height:2.15cqw;background:#dce5e5;border-radius:1.2cqw;}
.rating-fill{position:relative;height:100%;width:0;background:linear-gradient(90deg,#376b96,#558fa8 66%,#7db5b2);border-radius:inherit;}
.rating-fill::after{content:'';position:absolute;right:.12cqw;top:50%;width:2.9cqw;height:2.9cqw;border-radius:50%;transform:translate(30%,-50%);background:radial-gradient(circle,#fff 10%,#effdf1a8 33%,transparent 66%);}
.rating-details{display:flex;gap:3cqw;justify-content:center;color:#536c7b;font-size:3.55cqw;font-weight:650;margin:3.2cqw auto 4.9cqw;}
.rating-details strong{color:#1b3d58;font-variant-numeric:tabular-nums;margin-left:.5cqw;}
.rating-actions{display:grid;gap:2.2cqw;}
.result-dialog .rating-actions .station-btn{margin:0;background:#e7eceb;color:#214969;box-shadow:none;border:0;border-radius:3.25cqw;}
.result-dialog .rating-actions .station-btn.primary{background:#1d4d76;color:#fff9e9;}
.result-dialog .rating-actions .station-btn:focus-visible{outline-color:#396c91;outline-offset:.56cqw;}
.level-rating{position:absolute;inset:auto 0 .6cqw;display:flex;align-items:center;justify-content:center;gap:.33cqw;height:1.41cqw;}
.level-rating i{width:1.16cqw;height:1.16cqw;border-radius:50%;border:1px solid #779cb95f;background:#284a70;}
.level-rating i:first-child.active{background:#66b8e9;border-color:#b9e6f5;}
.level-rating i:nth-child(2).active{background:#ff997e;border-color:#ffd1bd;}
.level-rating i:nth-child(3).active{background:#80cca5;border-color:#c9eac5;}
.landscape .result-dialog{width:45cqw;padding:2.7cqw 3cqw 2.5cqw;border-radius:2.6cqw;}
.landscape .result-dialog h2{font-size:3.08cqw;margin-bottom:1.35cqw;}
.landscape .rating-balls{gap:1.12cqw;margin-bottom:1.45cqw;}
.landscape .rating-slot{width:6.35cqw;height:6.35cqw;}
.landscape .rating-slot.earned::after{border-width:.18cqw;}
.landscape .rating-meter-label{font-size:1.48cqw;margin-bottom:.53cqw;}
.landscape .rating-percent{font-size:2.08cqw;}
.landscape .rating-track{height:.88cqw;}
.landscape .rating-fill::after{width:1.3cqw;height:1.3cqw;right:.05cqw;}
.landscape .rating-details{font-size:1.5cqw;gap:1.25cqw;margin:1.15cqw 0 1.68cqw;}
.landscape .rating-actions{grid-template-columns:1fr 1fr;gap:.86cqw;}
.landscape .result-dialog .rating-actions .station-btn{border-radius:1.24cqw;}
.landscape .level-rating{bottom:.23cqw;height:.63cqw;gap:.14cqw;}
.landscape .level-rating i{width:.49cqw;height:.49cqw;}
@media(prefers-reduced-motion:reduce){.swipe-gesture i{display:none;}.rating-slot.earned .rating-ball{animation:none;opacity:1;}.rating-slot.earned::after{animation:none;}}
.level-buttons .station-btn:not(.is-rated) .level-rating{visibility:hidden;}
.rating-slot:not(.earned) .rating-socket{filter:saturate(.55);opacity:.72;}

const directionOrder=['up','right','down','left'];
const directions={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};

const completed=balls=>balls.every(cell=>cell===-1);
const preparedLevels=new WeakMap();
function levelTerrain(level){
 if(preparedLevels.has(level))return preparedLevels.get(level);
 const {cols,rows}=level;
 const walls=new Uint8Array(cols*rows),holes=new Int8Array(cols*rows).fill(-1);
 const stops=new Uint8Array(cols*rows),cracks=new Uint8Array(cols*rows);
 for(const cell of level.walls)walls[cell]=1;
 level.holes.forEach((cell,i)=>{holes[cell]=i;});
 level.stops?.forEach((cell,i)=>{stops[cell]=1<<i;});
 level.cracks?.forEach((cell,i)=>{cracks[cell]=1<<i;});
 const neighbors=[],ranks=[];
 for(const direction of directionOrder){
  const [dx,dy]=directions[direction];const steps=new Int16Array(cols*rows),rank=new Int8Array(cols*rows);
  for(let i=0;i<steps.length;i++){
   const x=i%cols,y=Math.floor(i/cols),nx=x+dx,ny=y+dy;
   steps[i]=nx<0||nx>=cols||ny<0||ny>=rows?-1:ny*cols+nx;

}

 const movers=[];
 for(let i=0;i<balls.length;i++)if(balls[i]>=0)movers.push(i);
 movers.sort((a,b)=>rank[balls[b]]-rank[balls[a]]);
 for(const i of movers){
  const from=balls[i];let cell=from;

   const target=steps[cell];

     if(record)events.push({type:'break',cell:target,ball:i});

   }

  const slot=document.createElement('span');slot.className='rating-slot';
  for(const layer of ['socket','ball']){
   const picture=document.createElement('canvas');picture.className=`rating-${layer}`;
   picture.width=picture.height=96;
   const ctx=picture.getContext('2d');
   if(layer==='socket')discoTarget(ctx,48,47,i,false);
   else discoBall(ctx,48,47,i,.86);
   slot.append(picture);
  }
  slots.push(slot);ratingBalls.append(slot);
 }
}

function geometry(){
 const cols=landscape?level.rows:level.cols,rows=landscape?level.cols:level.rows;
 const width=landscape?1640:720,height=landscape?720:1640;
 const arena=landscape
  ?level.intro?{x:84,y:79,w:1130,h:636}:{x:160,y:79,w:1320,h:636}
  :{x:12,y:161,w:696,h:level.intro?1272:1460};
 const preferred=index<15?138:Math.floor(1330/level.rows);
 const cell=Math.min(preferred,Math.floor(arena.w/cols),Math.floor(arena.h/rows));
 return {cols,rows,cell,width,height,left:Math.floor(arena.x+(arena.w-cols*cell)/2),top:Math.floor(arena.y+(arena.h-rows*cell)/2)};
}
let grid=geometry();
function screenXY(i){
 const x=i%level.cols,y=Math.floor(i/level.cols);
 const col=landscape?level.rows-1-y:x, row=landscape?x:y;
 return [grid.left+(col+.5)*grid.cell,grid.top+(row+.5)*grid.cell];
}
function buildField(){
 grid=geometry();
 const {cols,rows,cell,width,height,left:startX,top:startY}=grid;
 field.width=canvas.width=width;field.height=canvas.height=height;
 const w=cols*cell,h=rows*cell;
 discoBackdrop(stage,width,height);
 const tile=landscape?95:90;
 for(let y=landscape?0:97;y<height;y+=tile)for(let x=0;x<width;x+=tile){
  discoTile(stage,x,y,tile,Math.floor(x/tile)*3+Math.floor(y/tile)*2,true);
 }
 if(!landscape){
  rect(stage,0,0,width,91,0,gradient(stage,0,0,width,90,['#211635','#2b1839','#17182f']));
  rect(stage,0,89,width,3.5,0,gradient(stage,0,89,width,89,['#eb76b9','#7765ac','#67aabd']));
  rect(stage,0,92,width,4,0,'#0d1025');
 }
 const surround=landscape?12:16;
 if(startX>surround&&startY>surround){
  stage.save();stage.shadowBlur=14;stage.shadowColor='#f26fbc4d';
  rect(stage,startX-5,startY-5,w+10,h+10,15,'#190f32','#bf91cd8c',2.6);stage.restore();
 }
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const xx=startX+x*cell,yy=startY+y*cell;
  discoTile(stage,xx,yy,cell,x*2+y*3);
 }
 grain(stage,[0,0,width,height],9621,16000,'#f0d5f325','#09071d28');
 for(const i of level.walls){
  const [x,y]=screenXY(i);stage.save();stage.translate(x,y);stage.scale(cell/86,cell/86);discoWall(stage,0,0,i);stage.restore();
 }
}
function at(x,y,draw){ctx.save();ctx.translate(x,y);ctx.scale(grid.cell/88,grid.cell/88);draw();ctx.restore();}
function mechanicCells(){
 if(level.intro==='stop')return level.stops;
 if(level.intro==='break')return level.cracks;
 if(level.intro==='gate')return [level.gate.switchCell,level.gate.cell];
 if(level.intro==='token')return [level.token];
 return [];
}
function drawMechanics(state,breakCell,shattered){
 for(const [i,cell] of (level.stops??[]).entries())at(...screenXY(cell),()=>stopTile(ctx,0,0,Boolean(state.stops&(1<<i))));
 for(const [i,cell] of (level.cracks??[]).entries()){
  if(cell===breakCell? !shattered : state.cracks&(1<<i))at(...screenXY(cell),()=>crackedTile(ctx,0,0,cell));
 }
 if(level.gate){
  at(...screenXY(level.gate.switchCell),()=>switchTile(ctx,0,0,state.balls.includes(level.gate.switchCell)));
  at(...screenXY(level.gate.cell),()=>gateTile(ctx,0,0,gateIsOpen(state.balls,level)));
 }
 if(level.openPassage!==undefined)at(...screenXY(level.openPassage),()=>gateTile(ctx,0,0,true));
 if(level.token!==undefined&&!state.token)at(...screenXY(level.token),()=>discoToken(ctx,0,0));
 if(level.intro&&!introCleared){
  const color=mechanicNotes[level.intro].color;
  for(const cell of mechanicCells())if(cell!==breakCell||!shattered)at(...screenXY(cell),()=>mechanicHalo(ctx,0,0,color));
 }
 if(level.rewardKind&&!movesUsed){
  const {cell}=rewardOption(index,level.rewardKind);
  at(...screenXY(cell),()=>mechanicHalo(ctx,0,0,'#e9bcef'));
 }
}
function drawBall(i,x,y,charged,size=1,alpha=1,spin=0){
 at(x,y,()=>{
  discoBall(ctx,0,0,i,size,alpha,spin);
  if(charged&&level.charged===i&&size>.74)chargeMark(ctx,20,-17);
 });
}
function draw(traces=[],duration=1,impactTime=null){
 ctx.clearRect(0,0,grid.width,grid.height);ctx.drawImage(field,0,0);
 const frameState=duration<.77&&transition?transition.previous:boardState;
 const shatter=duration<1||impactTime!==null?transition?.shatter:undefined;
 drawMechanics(frameState,shatter?.event.cell,impactTime!==null);
 const charged=shatter?impactTime===null&&transition.previous.charge:frameState.charge;
 for(const [i,target] of level.holes.entries()){
  const [x,y]=screenXY(target);
  const pending=traces.some(t=>t.i===i&&t.sunk)&&duration<.92;
  at(x,y,()=>discoTarget(ctx,0,0,i,boardState.balls[i]===-1&&!pending));
 }
 if(shatter&&impactTime!==null&&impactTime<1){
  const [x,y]=screenXY(shatter.event.cell),[bx,by]=screenXY(boardState.balls[shatter.event.ball]);
  at(x,y,()=>mirrorBreakEffect(ctx,shatter,(x-bx)/grid.cell,(y-by)/grid.cell,impactTime));
 }
 for(const [i,ball] of boardState.balls.entries()){
  const trace=traces.find(t=>t.i===i);
  if(!trace){if(ball>=0)drawBall(i,...screenXY(ball),charged);continue;}
  const [x,y]=screenXY(trace.from),[xf,yf]=screenXY(trace.to);
  const time=Math.min(1,duration/(trace.sunk?.78:1));
  const p=1-Math.pow(1-time,2);
  const sink=trace.sunk?Math.max(0,(duration-.67)/.33):0;
  if(sink<1)drawBall(i,x+(xf-x)*p,y+(yf-y)*p,charged,1-sink*.85,1-sink,p*2.7);
  if(trace.sunk&&duration>.68&&duration<.99){
   at(xf,yf,()=>{
    ctx.save();ctx.globalAlpha=Math.max(0,(1-duration)*2.7);const r=28+(duration-.68)*39;ellipse(ctx,0,0,r,r,null,discoColors[i][0],3.6);ctx.restore();
   });
  }
 }
 if(transition&&duration>.69&&duration<1)for(const event of transition.events){
  if(event.type==='break')continue;
  at(...screenXY(event.cell),()=>mechanicEffect(ctx,0,0,event.type,(duration-.69)/.31));
 }
}
function save(){try{localStorage.setItem(storage,JSON.stringify(progress));}catch{}}
function tokenBalance(){return Math.max(0,progress.tokenCarry+progress.tokens.length-progress.tokensSpent);}
function moveLimit(){return level.practice?Infinity:level.budget;}
function canRedeem(){return screen==='game'&&movesUsed===0&&!animation&&!level.rewardKind&&Boolean(level.rewards?.length)&&tokenBalance()>=rewardCost;}
function renderRewardHud(){
 rewardHud.hidden=index+1<tokensFrom;
 const picked=boardState.token&&!progress.tokens.includes(index);
 const count=Math.min(rewardCost,tokenBalance()+Number(picked));
 const choosing=canRedeem();
 rewardActive.hidden=!level.rewardKind;
 rewardActive.textContent=level.rewardKind?rewardNames[level.rewardKind]:'';
 rewardChoices.hidden=!choosing;
 rewardMeter.hidden=choosing;
 rewardCount.textContent=`${count}/${rewardCost}`;
 rewardMeter.setAttribute('aria-valuenow',count);
 rewardMeter.setAttribute('aria-valuetext',`${count} из ${rewardCost}`);
 for(const [i,orb] of rewardSpheres.entries()){
  orb.classList.toggle('is-filled',i<count);
  orb.classList.toggle('is-earned',picked&&i===count-1);
 }
}
function renderHud(){
 levelDisplay.textContent=index+1;
 remain.closest('.stat-right').hidden=Boolean(level.practice);
 remain.textContent=level.practice?'':level.budget-movesUsed;
 renderRewardHud();
}
function starCount(moves,minimum){
 if(moves===minimum)return 3;
 return moves-minimum<=Math.max(1,Math.floor(minimum/3))?2:1;
}
function renderLevels(){
 campaignProgress.textContent=`Пройдено ${progress.finished.length} из ${metroLevels.length}`;
 for(const button of chapterSelect.children)button.setAttribute('aria-pressed',String(Number(button.dataset.page)===levelPage));
 for(const child of nav.children){
  const n=Number(child.dataset.level),entry=metroLevels[n],best=progress.bestMoves[n];
  const baseRating=best===undefined?0:starCount(best,entry.minimum);
  const assistedRating=Math.max(0,...(entry.rewards??[]).map(option=>{
   const moves=progress.rewardBests[n]?.[option.kind];
   return moves===undefined?0:starCount(moves,option.minimum);
  }));
  const rating=n+1>=ratingFrom?Math.max(baseRating,assistedRating):0;
  const hasToken=progress.tokens.includes(n);
  child.hidden=Math.floor(n/10)!==levelPage;
  child.setAttribute('aria-current',String(n===index));
  child.setAttribute('aria-label',`Уровень ${n+1}, ${entry.name}${rating?`, лучший результат ${rating} из 3${assistedRating>baseRating?' с бонусом':''}`:''}${hasToken?', диско-жетон собран':''}`);
  child.classList.toggle('done',progress.finished.includes(n));
  child.classList.toggle('has-token',hasToken);
  for(const [i,indicator] of [...child.querySelectorAll('.level-rating i')].entries())indicator.classList.toggle('active',i<rating);
  child.classList.toggle('is-rated',rating>0);
 }
}
function nextTutorialMove(){
 const queue=[{state:boardState,first:null}],seen=new Set([String(boardState.balls)]);
 for(const entry of queue){
  for(const direction of directionOrder){
   const {next}=slideLevel(entry.state,direction,level,false);
   const key=String(next.balls);
   if(seen.has(key))continue;
   const first=entry.first??direction;
   if(completed(next.balls))return first;
   seen.add(key);queue.push({state:next,first});
  }
 }
 return null;
}
function prepareMechanicTip(){
 if(!level.intro)return;
 const {title,detail}=mechanicNotes[level.intro];
 mechanicTip.querySelector('strong').textContent=title;
 mechanicTip.querySelector('.mechanic-explanation').textContent=detail;
 const icon=mechanicTip.querySelector('canvas').getContext('2d');icon.clearRect(0,0,96,96);
 if(level.intro==='stop')stopTile(icon,48,48,true);
 if(level.intro==='break')crackedTile(icon,48,48,0);
 if(level.intro==='gate')switchTile(icon,48,48,true);
 if(level.intro==='token')discoToken(icon,48,48);
}
function displayDirection(logicalDirection){
 return landscape?directionOrder.find(d=>rotatedDirection[d]===logicalDirection):logicalDirection;
}
function renderTutorial(){
 mechanicTip.hidden=screen!=='game'||!level.intro||introCleared;
 const cue=!mechanicTip.hidden&&!movesUsed&&displayDirection(level.guide);
 mechanicCue.hidden=!cue;
 mechanicCue.textContent=cue?`${arrowGlyphs[cue]}  Свайпни ${tutorialArrows[cue]}`:'';
 tutorial.hidden=screen!=='game'||index>1||completed(boardState.balls);
 if(tutorial.hidden)return;
 const direction=displayDirection(nextTutorialMove());
 tutorial.dataset.direction=direction??'restart';
 tutorialTitle.textContent=direction?`Свайпни ${tutorialArrows[direction]}`:'Начни заново';
 tutorialDetail.textContent=direction?(movesUsed?'Шары останавливаются в лунках со своим знаком.':'Свайп двигает шар до края или лунки.'):'Выбери перезапуск в меню паузы.';
}
function setScreen(name,focus=true){
 if(name!=='win'){cancelAnimationFrame(ratingAnimation);ratingAnimation=0;}
 screen=name;clearTimeout(hold);pointer=null;
 const showingGame=['game','pause','win','retry'].includes(name);
 game.hidden=!showingGame;game.inert=showingGame&&name!=='game';
 home.hidden=showingGame;home.inert=name==='levels';
 continueButton.disabled=!progress.started;
 continueButton.classList.toggle('primary',progress.started);
 newGameButton.classList.toggle('primary',!progress.started);
 home.classList.toggle('has-progress',progress.started);
 for(const modal of modals)modal.hidden=modal.dataset.screen!==name;
 if(name==='levels'){levelPage=Math.floor(index/10);renderLevels();}
 renderTutorial();
 renderRewardHud();
 if(!focus)return;
 if(name==='game')lcd.focus({preventScroll:true});
 else if(name==='home')(progress.started?continueButton:newGameButton).focus({preventScroll:true});
 else modals.find(m=>m.dataset.screen===name)?.querySelector('button:not(:disabled)')?.focus({preventScroll:true});
}
function renderResult(moves){
 const simple=index+1<ratingFrom;
 const score=Math.round(100*level.minimum/moves);
 const earned=starCount(moves,level.minimum);
 const message=['','В следующий раз получится лучше!','Отличная работа!','Кратчайший путь. Поздравляю!'][earned];
 result.dataset.rating=earned;
 result.dataset.simple=String(simple);
 result.querySelector('#result-title').textContent=simple?'Отлично!':message;
 result.querySelector('.rating-moves').textContent=moves;
 result.querySelector('.rating-minimum').textContent=level.minimum;
 result.querySelector('.token-result').hidden=!boardState.token;
 result.querySelector('.reward-result').hidden=!level.rewardKind;
 document.querySelector('#result-summary').textContent=simple?'Можно переходить к следующему уровню.':`Результат ${earned} из 3. Эффективность ${score}%. Ходов ${moves}, минимум ${level.minimum}.${boardState.token?' Диско-жетон собран.':''}${level.rewardKind?' Пройдено с бонусом.':''}`;
 meter.setAttribute('aria-valuenow',score);
 for(const [i,slot] of slots.entries())slot.classList.toggle('earned',i<earned);
 function setPercent(value){percent.textContent=`${Math.round(value)}%`;fill.style.width=`${value}%`;}
 cancelAnimationFrame(ratingAnimation);
 if(simple||reduce.matches){setPercent(score);return;}
 setPercent(0);
 const start=performance.now();
 function animate(now){
  const t=Math.min(1,(now-start)/820);
  setPercent(score*(1-(1-t)**3));
  ratingAnimation=t<1?requestAnimationFrame(animate):0;
 }
 ratingAnimation=requestAnimationFrame(animate);
}
function settle(){
 animation=0;
 const learned=level.intro&&!introCleared&&transition?.events.some(e=>e.type===level.intro);
 if(learned)introCleared=true;
 transition=null;
 if(learned)draw();
 if(completed(boardState.balls)){
  if(!progress.finished.includes(index))progress.finished.push(index);
  if(boardState.token&&!progress.tokens.includes(index))progress.tokens.push(index);
  if(level.rewardKind){
   const records=progress.rewardBests[index]??={};
   records[level.rewardKind]=Math.min(records[level.rewardKind]??Infinity,movesUsed);
   delete progress.activeRewards[index];
  }else progress.bestMoves[index]=Math.min(progress.bestMoves[index]??Infinity,movesUsed);
  progress.resumeAfterWin=true;
  save();
  renderResult(movesUsed);
  document.querySelector('[data-cmd="next"]').textContent=index<metroLevels.length-1?'Следующий уровень':'К уровням';
  setScreen('win');
 }else if(movesUsed===moveLimit())setScreen('retry');
 else renderTutorial();
}
function move(direction){
 if(screen!=='game'||animation||movesUsed===moveLimit()||completed(boardState.balls))return;
 const {next,traces,events,changed}=slideLevel(boardState,landscape?rotatedDirection[direction]:direction,level);
 if(!changed){status.textContent='Шары остались на месте.';return;}
 movesUsed++;transition={previous:boardState,events};boardState=next;renderHud();
 tutorial.hidden=true;
 const summaries={stop:'Стоп-плитка сработала.',break:'Блок разбит.',gate:'Дверь переключилась.',token:'Диско-жетон собран.'};
 const effect=events.length?summaries[events[0].type]:'';
 const remaining=level.practice?'':`Осталось ходов: ${level.budget-movesUsed}.`;
 status.textContent=[effect,remaining].filter(Boolean).join(' ');
 if(reduce.matches){draw();settle();return;}
 const fracture=events.find(event=>event.type==='break');
 if(fracture)transition.shatter=buildMirrorBreak(fracture);
 const impactStart=fracture&&traces.some(trace=>trace.i===fracture.ball)?268:72;
 const shatterDuration=452;
 const animationDuration=fracture?impactStart+shatterDuration:300;
 const start=performance.now();
 function frame(now){
  const elapsed=now-start;
  const impact=fracture&&elapsed>=impactStart?Math.min(1,(elapsed-impactStart)/shatterDuration):null;
  draw(traces,Math.min(1,elapsed/300),impact);
  if(elapsed<animationDuration)animation=requestAnimationFrame(frame);else settle();
 }
 animation=requestAnimationFrame(frame);
}
function openLevel(n,show=true){
 cancelAnimationFrame(animation);animation=0;transition=null;introCleared=false;index=n;level=activeLevel(n);
 movesUsed=0;boardState=beginLevel(level);prepareMechanicTip();buildField();renderHud();draw();
 if(show){
  progress.current=n;progress.started=true;progress.resumeAfterWin=false;save();
  setScreen('game');
 }
}
canvas.addEventListener('pointerdown',e=>{
 if(!e.isPrimary||e.button!==0||screen!=='game')return;
 pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);lcd.focus({preventScroll:true});
 hold=setTimeout(()=>{if(pointer&&!animation)setScreen('pause');},580);
});
canvas.addEventListener('pointermove',e=>{
 if(pointer?.id===e.pointerId&&Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>10)clearTimeout(hold);
});
canvas.addEventListener('pointerup',e=>{
 clearTimeout(hold);if(pointer?.id!==e.pointerId)return;
 const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;
 move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});
canvas.addEventListener('lostpointercapture',()=>{clearTimeout(hold);pointer=null;});
document.addEventListener('keydown',event=>{
 if(event.repeat||event.metaKey||event.altKey||event.ctrlKey)return;
 if(event.key==='Escape'&&!animation){
  if(screen==='game')setScreen('pause');else if(screen==='pause')setScreen('game');else if(screen==='levels')setScreen('home');return;
 }
 const d=keys[event.key]??keys[event.key.toLowerCase()];
 if(d&&screen==='game'){event.preventDefault();move(d);}
});
lcd.addEventListener('click',e=>{
 const control=e.target.closest('button');if(!control)return;
 if(control.dataset.reward){
  const kind=control.dataset.reward;
  if(canRedeem()&&rewardOption(index,kind)){
   progress.tokensSpent+=rewardCost;
   progress.activeRewards[index]=kind;
   openLevel(index);
   status.textContent=`Выбран бонус «${rewardNames[kind]}».`;
  }
  return;
 }
 if(control.dataset.page!==undefined){levelPage=Number(control.dataset.page);renderLevels();return;}
 if(control.dataset.level!==undefined){openLevel(Number(control.dataset.level));return;}
 const command=control.dataset.cmd;
 if(command==='new'){
  progress.tokens=[];
  progress.tokensSpent=0;
  progress.tokenCarry=0;
  progress.activeRewards={};
  openLevel(0);
  return;
 }
 if(command==='play'){
  if(completed(boardState.balls)||(progress.resumeAfterWin&&!movesUsed)){
   if(index+1<metroLevels.length)openLevel(index+1);else setScreen('levels');
  }else if(movesUsed===moveLimit())setScreen('retry');
  else setScreen('game');return;
 }
 if(command==='resume'){setScreen('game');return;}
 if(command==='home'||command==='levels'){setScreen(command);return;}
 if(command==='restart'){openLevel(index);return;}
 if(command==='next'){
  if(index+1<metroLevels.length)openLevel(index+1);
  else setScreen('levels');
 }
});
orientationPicker.addEventListener('click',event=>{
 const control=event.target.closest('[data-orientation]');if(!control)return;
 const next=control.dataset.orientation==='landscape';if(next===landscape)return;
 const moving=Boolean(animation);cancelAnimationFrame(animation);animation=0;
 landscape=next;layout.classList.toggle('landscape',landscape);
 for(const option of orientationPicker.querySelectorAll('button'))option.setAttribute('aria-pressed',String(option===control));
 clearTimeout(hold);pointer=null;paintMenu();buildField();draw();if(moving)settle();else renderTutorial();
});
nav.innerHTML=metroLevels.map((l,n)=>`<button type="button" class="station-btn" data-level="${n}" aria-label="Уровень ${n+1}, ${l.name}"><span>${n+1}</span><small class="level-rating" aria-hidden="true"><i></i><i></i><i></i></small></button>`).join('');
chapterSelect.innerHTML=Array.from({length:Math.ceil(metroLevels.length/10)},(_,page)=>`<button type="button" class="station-btn" data-page="${page}" aria-pressed="false">${page*10+1}–${Math.min(page*10+10,metroLevels.length)}</button>`).join('');
paintMenu();buildRatingBalls();
openLevel(index,false);setScreen('home',false);
</script></body></html>
